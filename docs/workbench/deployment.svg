<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 716" role="img" aria-labelledby="heading desc">
<title id="heading">Workbench deployment on the private tailnet</title>
<desc id="desc">The browser and the workers on the MacBook Air and Ubuntu server connect to Tailscale Serve on the server. Serve forwards requests to the Happier relay. The relay serves the web client and persists workspace records in SQLite on a Docker volume. The selected worker runs the agent CLI on its own files and contacts the model provider over HTTPS.</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#2858a0"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#006757"/></marker></defs>
<style>
text{fill:#172c45;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow,.kind,.region,.protocol,.outlabel,.meta{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.eyebrow,.region{font-size:12px;font-weight:600;letter-spacing:1.3px}.eyebrow,.meta,.detail,.hint{fill:#455d72}.heading{font-size:32px;font-weight:650;letter-spacing:-1.2px}.hosttitle{font-weight:650;font-size:20px}.detail,.hint{font-size:15px}.kind{fill:#53697c;font-size:11.5px;letter-spacing:.6px}.name{font-size:19px;font-weight:650}.protocol,.outlabel{font-size:13px}.protocol{fill:#254e87}.outlabel{fill:#006757}.meta{font-size:12px}.region{fill:#36536a}
.sheet{fill:#fff}.zone{fill:#f4f7fb;stroke:#a4b3c3;stroke-width:1.3;stroke-dasharray:6 5}.host{fill:#fff;stroke:#849aaf;stroke-width:1.3}.compose{fill:#f2f6fb;stroke:#c4d0dd}.service{fill:white;stroke:#6d89a7;stroke-width:1.4}.external{fill:#f3f9f7;stroke:#66978d;stroke-width:1.4}.link,.out{fill:none;stroke:#2858a0;stroke-width:2;stroke-linejoin:round;marker-end:url(#blue)}.out{stroke:#006757;marker-end:url(#teal)}.rule{fill:none;stroke:#d1dce5;stroke-width:1}.disk{fill:#f9fbfd;stroke:#71889e;stroke-width:1.4}
</style>
